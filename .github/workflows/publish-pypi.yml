name: Publish to PyPI

# Runs only when a GitHub Release is published — bump the version in
# backend/pyproject.toml, tag it, and cut a release; this handles the rest.
# Authenticates to PyPI via OIDC trusted publishing — no API token is ever
# stored in this repo. Requires a one-time "pending publisher" registration
# on PyPI (see backend/PYPI_PUBLISHING.md) matching this workflow's filename
# and the `pypi` environment name below.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,full]"
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: backend/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/creditsetu/
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
